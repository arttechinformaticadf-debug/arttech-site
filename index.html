<html lang="pt-BR">

<style>
:root{--bg:#030305;--panel:#0c0e16cc;--text:#fff;--muted:#aaa9b4;--pink:#ffa091;--lilac:#8da9fc;--line:#ffffff1c;--grad:linear-gradient(105deg,var(--pink),var(--lilac))}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Arial,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(#000,transparent 78%)}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:0 6vw}.header{height:74px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;background:#030305c9;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}.brand svg{width:37px;height:37px}.brand span{background:var(--grad);-webkit-background-clip:text;color:transparent}.nav{display:flex;gap:22px;align-items:center;color:#c6c5ce;font-size:13px}.nav a:hover{color:#fff}.button{display:inline-flex;align-items:center;gap:10px;padding:13px 18px;border-radius:999px;font-weight:700;background:var(--grad);color:#14131a;box-shadow:0 12px 38px #8da9fc22;transition:.2s}.button:hover{transform:translateY(-2px);box-shadow:0 16px 44px #8da9fc44}.outline{background:#ffffff08;color:#fff;border:1px solid var(--line)}.hero{min-height:650px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:80px;padding-bottom:70px}.eyebrow{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:8px 13px;color:#e4e3ea;font-size:11px;background:#ffffff08}.dot{width:7px;height:7px;border-radius:50%;background:var(--lilac);box-shadow:0 0 14px var(--lilac)}h1{font-size:clamp(45px,7vw,82px);line-height:1.02;letter-spacing:-.06em;margin:24px 0}h1 em,h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;color:transparent}.lead{max-width:560px;color:var(--muted);font-siz</style></title></head>
